name: WSA pointer probe APK

on:
  push:
    branches: [feat/wsa-pointer-probe]
    paths:
      - 'tools/wsa-pointer-probe/**'
      - '.github/workflows/wsa-pointer-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: tools/wsa-pointer-probe/test.sh
      - run: tools/wsa-pointer-probe/build.sh "$RUNNER_TEMP/pointer-probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pointer-probe-${{ github.sha }}
          path: ${{ runner.temp }}/pointer-probe
          if-no-files-found: error
          retention-days: 7
