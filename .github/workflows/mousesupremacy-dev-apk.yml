name: MouseSupremacy development APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mousesupremacy-dev-apk.yml'

permissions:
  contents: read

concurrency:
  group: mousesupremacy-dev-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Side-by-side Android development APK
    if: github.repository == 'xsexiestbeastalivex-rgb/pokedaisy-mousesupremacy' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize pinned native dependencies
        run: git -c submodule.third_party/azahar.update=none submodule update --init --recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install the pinned Android build dependencies
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          min-wrapper-count: 1

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: false

      - name: Build the isolated app with x86_64 and arm64
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p app/src/dev/assets
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > app/src/dev/assets/source-commit.txt
          ./gradlew :app:assembleDev -Ppokedaisy.x86_64=true --stacktrace

      - name: Verify package, native libraries and debug signature
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/dev/app-dev.apk
          tools="${ANDROID_HOME}/build-tools/34.0.0"
          package_id="$("${tools}/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$package_id" = com.pokedaisy.app.dev

          test "$(unzip -p "$apk" assets/source-commit.txt)" = "$(git rev-parse HEAD)"
          entries="$(unzip -Z1 "$apk")"
          for abi in x86_64 arm64-v8a; do
            grep -Fxq "lib/${abi}/libpokedaisy.so" <<< "$entries"
          done
          abis="$(sed -n 's|^lib/\([^/]*\)/[^/]*\.so$|\1|p' <<< "$entries" | sort -u | paste -sd, -)"
          test "$abis" = arm64-v8a,x86_64

          mkdir -p dist
          cp "$apk" dist/pokedaisy-dev.apk
          cp NOTICE LICENSE dist/
          {
            printf 'Source: https://github.com/%s/tree/%s\n' "$SOURCE_REPOSITORY" "$(git rev-parse HEAD)"
            printf 'Package: %s\nABIs: %s\n' "$package_id" "$abis"
            printf 'Signing: disposable CI debug key\n'
            "${tools}/apksigner" verify --print-certs "$apk"
            git submodule status --recursive
          } > dist/build-info.txt
          (cd dist && sha256sum pokedaisy-dev.apk > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedaisy-dev-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
